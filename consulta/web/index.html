<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Búsqueda</title>
  <link rel="stylesheet" href="css/styles.css?v=0017">
</head>
<body>
  <h1>Búsqueda <span class="page-version">v0017</span></h1>

  <details class="panel search-panel" open>
    <summary class="search-panel-toggle">Término de búsqueda</summary>
    <form id="search-form" class="search-row">
      <input
        id="query"
        type="search"
        placeholder="Escribe para buscar…"
        autocomplete="off"
        enterkeyhint="search"
      >
      <button id="btn-clear" type="button" class="btn-secondary">Limpiar</button>
    </form>
  </details>

  <details class="panel search-panel">
    <summary class="search-panel-toggle">Número de socio</summary>
    <form id="socio-search-form" class="search-row">
      <div class="socio-number-field">
        <span class="socio-number-prefix" aria-hidden="true">202627</span>
        <input
          id="socio-number"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="000"
          autocomplete="off"
          enterkeyhint="search"
        >
      </div>
      <button id="btn-clear-socio" type="button" class="btn-secondary">Limpiar</button>
    </form>
  </details>

  <p id="status">Escribe al menos 4 caracteres para buscar</p>

  <div id="results-wrap" class="hidden">
    <div class="table-scroll">
      <table>
        <thead>
          <tr id="table-head"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <p id="results-count" class="results-count" hidden></p>
    <p id="request-timing" class="request-timing" hidden></p>
  </div>

  <script src="js/app.js?v=0017" type="module"></script>
</body>
</html>
